<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff5f7">
    <title>A Birthday Surprise ♡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="app">
        <header class="topbar"><a class="brand" href="index.html">♡ <span>little moments</span></a><span
                class="eyebrow">A PRIVATE SURPRISE</span></header>
        <main class="screen active lock-screen">
            <div class="lock-card">
                <div class="flower">✿</div>
                <p class="eyebrow">A LITTLE SURPRISE FOR YOU</p>
                <h1>Something lovely<br><em>is waiting...</em></h1>
                <p class="muted">Enter the secret code to unlock your birthday gift.</p>
                <div class="pin" id="pin" aria-label="6-digit PIN">○　○　○　○　○　○</div>
                <div class="keypad" id="keypad"><button type="button" data-key="1">1</button><button type="button"
                        data-key="2">2</button><button type="button" data-key="3">3</button><button type="button"
                        data-key="4">4</button><button type="button" data-key="5">5</button><button type="button"
                        data-key="6">6</button><button type="button" data-key="7">7</button><button type="button"
                        data-key="8">8</button><button type="button" data-key="9">9</button><button type="button"
                        data-key="clear" aria-label="Delete">⌫</button><button type="button"
                        data-key="0">0</button><button type="button" data-key="enter" aria-label="Enter">↵</button>
                </div>
                <p class="hint" id="hint">Hint: a special date · Password: 111125</p>
            </div>
        </main>
        <footer>made with <span>♥</span> for a beautiful day</footer>
    </div>
    <script src="js/password.js"></script>
</body>

</html>
