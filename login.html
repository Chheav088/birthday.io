<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff5f7">
    <title>Your Birthday Surprise ♡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style1.css">
</head>

<body>
    <section class="screen active" id="promptScreen">
        <div class="card prompt-card">
            <div class="cute-mascot" aria-hidden="true">🧸🎀</div>
            <h2 class="title-fredoka" id="promptQuestion">Are you ready for your birthday surprise?</h2>
            <p class="subtitle">Choose carefully... 👀</p>
            <div class="prompt-buttons" id="promptBtnArea">
                <button class="btn-yes" id="yesBtn" type="button">Yes, show me! 🎉</button>
                <button class="btn-no" id="noBtn" type="button">No, not yet 🙈</button>
            </div>
        </div>
    </section>

    <script src="js/login.js"></script>
</body>
</html>
